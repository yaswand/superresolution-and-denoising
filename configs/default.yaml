# =============================================================================
# default.yaml
#
# Central configuration for the grayscale image restoration pipeline
# (2x super-resolution + denoising, KLA-style hackathon challenge).
#
# Every script (train.py, infer.py) loads this file via utils.load_config()
# and CLI args override individual keys (dot-path, e.g. --set train.lr=1e-4).
# Keep this as the single source of truth for hyperparameters so runs are
# reproducible from the config alone.
# =============================================================================

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  # Root directory containing GT/ and NoisyLR/ subfolders of paired .npy files.
  # GT/xxxxxx.npy  -> high-resolution ground truth, shape [H, W]
  # NoisyLR/xxxxxx.npy -> degraded low-resolution input, shape [H/scale, W/scale]
  root: "./train"

  # File formats to scan for, in priority order. The loader will accept any
  # of these per-file so a mixed-format dataset (e.g. some .npy, some .png)
  # works without code changes.
  extensions: [".npy", ".png", ".jpg", ".jpeg"]

  # LR -> GT upsampling factor. Confirmed via verify_dims.py.
  scale: 2

  # Fraction of files held out for validation (split at the filename level,
  # seeded, so train/val never overlap and the split is reproducible).
  val_fraction: 0.1

  # Aligned random-crop patch size, measured in LR pixels. GT crop is
  # patch_size * scale. Set to null to disable cropping and use full images
  # (only recommended if all images share the same resolution).
  patch_size: 96

  num_workers: 4
  pin_memory: true

# ---------------------------------------------------------------------------
# Augmentation
# ---------------------------------------------------------------------------
augmentation:
  # Paired geometric augmentations applied identically to LR and GT so they
  # stay pixel-aligned.
  horizontal_flip: true
  vertical_flip: true
  random_rotate90: true

  # Synthetic degradation applied to the LR tensor ONLY (never GT), for
  # robustness against out-of-distribution degraded inputs at eval time.
  # Each is applied independently with the given probability.
  lr_gaussian_noise:
    enabled: true
    prob: 0.3
    sigma_range: [0.0, 0.02]   # std dev, fraction of per-image normalized scale

  lr_speckle_noise:
    enabled: true
    prob: 0.2
    sigma_range: [0.0, 0.03]

  lr_gaussian_blur:
    enabled: true
    prob: 0.15
    kernel_size: 3
    sigma_range: [0.1, 0.8]

# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------
model:
  # "baseline"  -> SRResidualUNet (existing residual U-Net + PixelShuffle head)
  # "compact_restormer" -> lightweight Restormer-style transformer backbone
  name: "compact_restormer"

  in_channels: 1
  out_channels: 1
  scale: 2

  # Baseline (SRResidualUNet) specific
  baseline:
    base_ch: 64

  # Compact Restormer-style backbone specific
  compact_restormer:
    embed_dim: 48
    num_blocks: [2, 3, 3, 4]     # per encoder stage (4 stages incl. bottleneck)
    num_refinement_blocks: 2
    heads: [1, 2, 4, 8]
    ffn_expansion_factor: 2.2
    bias: false

# ---------------------------------------------------------------------------
# Loss
# ---------------------------------------------------------------------------
loss:
  # Base pixel loss: "l1" or "charbonnier"
  pixel_loss: "charbonnier"
  charbonnier_eps: 1.0e-3

  weights:
    pixel: 1.0
    ssim: 0.2
    perceptual: 0.0   # disabled by default; enable only if it helps LPIPS

  perceptual:
    enabled: false
    layers: ["relu1_2", "relu2_2", "relu3_3"]

# ---------------------------------------------------------------------------
# Training
# ---------------------------------------------------------------------------
train:
  epochs: 100
  batch_size: 16
  lr: 2.0e-4
  weight_decay: 1.0e-4
  optimizer: "adamw"

  # Cosine LR schedule with linear warmup (epochs).
  warmup_epochs: 3
  min_lr: 1.0e-6

  amp: true
  grad_clip_norm: 1.0

  seed: 42

  # Stop if val PSNR doesn't improve for this many epochs. Set to null to disable.
  early_stopping_patience: 15

  checkpoint_dir: "./checkpoints"
  log_dir: "./logs"
  resume: null

  # How often (in epochs) to run validation.
  val_interval: 1

# ---------------------------------------------------------------------------
# Metrics
# ---------------------------------------------------------------------------
metrics:
  compute_lpips: false   # requires `lpips` package; see requirements.txt
  lpips_net: "alex"

# ---------------------------------------------------------------------------
# Inference
# ---------------------------------------------------------------------------
inference:
  checkpoint: "./checkpoints/best.pt"
  input_dir: "/path/to/test/NoisyLR"
  output_dir: "./predictions"
  batch_size: 8
  amp: true
  # If input images are larger than this many pixels (H*W), process in tiles
  # to bound GPU memory. Set to null to disable tiling.
  tile_size: 512
  tile_overlap: 32