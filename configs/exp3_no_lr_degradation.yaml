# =============================================================================
# configs/exp3_no_lr_degradation.yaml
#
# Experiment 3: identical to Experiment 1 (configs/exp1_charbonnier.yaml)
# in every respect EXCEPT that LR-only synthetic degradation augmentation
# (Gaussian noise / speckle noise / Gaussian blur applied to the NoisyLR
# tensor only, during training) is disabled.
#
# Unchanged from Experiment 1:
#   - model (compact_restormer, same architecture config)
#   - optimizer (AdamW, same lr / weight_decay)
#   - scheduler (CosineAnnealingLR, same epochs / min_lr / warmup_epochs)
#   - DDP setup (unchanged in train_ddp.py; this config carries no DDP knobs)
#   - seed (42)
#   - batch size (16)
#   - paired geometric augmentation (flip/flip/rot90 -- all still enabled)
#   - loss (Charbonnier-only: pixel weight 1.0, ssim weight 0.0)
#   - eval pipeline (ID + OOD via evaluate.py / ood.py, identical to Exp1)
#
# Changed from Experiment 1:
#   - augmentation.lr_gaussian_noise.enabled: true -> false
#   - augmentation.lr_speckle_noise.enabled:  true -> false
#   - augmentation.lr_gaussian_blur.enabled:  true -> false
#   - train.checkpoint_dir: ./checkpoints_exp1 -> ./checkpoints_exp3
#   - inference.checkpoint: points at the exp3 checkpoint dir
#
# Note: the enabled:false flags below are the actual, sufficient switch
# (see dataset.py:_apply_lr_only_degradation, which checks cfg.get(...,
# {}).get("enabled", False) per-perturbation before ever touching the LR
# tensor). The prob/sigma_range/kernel_size values are left in place only
# for readability/diffing against exp1; they have no effect while disabled.
# =============================================================================

data:
  root: "./train"
  extensions: [".npy", ".png", ".jpg", ".jpeg"]
  scale: 2
  val_fraction: 0.1
  patch_size: 96
  num_workers: 4
  pin_memory: true

augmentation:
  horizontal_flip: true
  vertical_flip: true
  random_rotate90: true

  # --- LR-only synthetic degradation: DISABLED for Experiment 3 ---
  lr_gaussian_noise:
    enabled: false
    prob: 0.3
    sigma_range: [0.0, 0.02]

  lr_speckle_noise:
    enabled: false
    prob: 0.2
    sigma_range: [0.0, 0.03]

  lr_gaussian_blur:
    enabled: false
    prob: 0.15
    kernel_size: 3
    sigma_range: [0.1, 0.8]

model:
  name: "compact_restormer"
  in_channels: 1
  out_channels: 1
  scale: 2

  baseline:
    base_ch: 64

  compact_restormer:
    embed_dim: 48
    num_blocks: [2, 3, 3, 4]
    num_refinement_blocks: 2
    heads: [1, 2, 4, 8]
    ffn_expansion_factor: 2.2
    bias: false

loss:
  pixel_loss: "charbonnier"
  charbonnier_eps: 1.0e-3

  weights:
    pixel: 1.0
    ssim: 0.0          # unchanged from Exp1: Charbonnier-only
    perceptual: 0.0

  perceptual:
    enabled: false
    layers: ["relu1_2", "relu2_2", "relu3_3"]

train:
  epochs: 100
  batch_size: 16
  lr: 2.0e-4
  weight_decay: 1.0e-4
  optimizer: "adamw"

  warmup_epochs: 3
  min_lr: 1.0e-6

  amp: true
  grad_clip_norm: 1.0

  seed: 42

  early_stopping_patience: 15

  checkpoint_dir: "./checkpoints_exp3"
  log_dir: "./logs"
  resume: null

  val_interval: 1

metrics:
  lpips_net: "alex"

inference:
  checkpoint: "./checkpoints_exp3/best.pt"
  input_dir: "/path/to/test/NoisyLR"
  output_dir: "./predictions"
  batch_size: 8
  amp: true
  tile_size: 512
  tile_overlap: 32
